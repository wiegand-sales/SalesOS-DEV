<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sales OS · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#EEEDE9;font-family:Urbanist,system-ui,sans-serif;color:#1d1c1a}
body.embed{background:transparent}
body.tvmode{cursor:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.tv{width:1920px;height:1080px;padding:28px 34px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;background:#EEEDE9}
body.embed .tv{border-radius:22px}
/* Banner: Farbverlauf mit Fortschrittsbalken (Entwurf „1 (vorher)“) */
.b1{border-radius:20px;padding:22px 28px;color:#fff;background:linear-gradient(135deg,#E9773F 0%,#DE5A5E 50%,#C23B66 100%);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));flex-shrink:0}
.b1>div{padding:0 22px;border-left:1px solid rgba(255,255,255,.28);min-width:0}.b1>div:first-child{border-left:0;padding-left:0}
.b1 small{display:block;font-size:15px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
.b1 b{display:block;font-size:56px;font-weight:300;line-height:1.1}
.b1 em{display:block;font-style:normal;font-size:17px;color:rgba(255,255,255,.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b1 .pg{height:8px;border-radius:4px;background:rgba(255,255,255,.25);margin-top:10px;overflow:hidden;position:relative}
.b1 .pg i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .8s}
.b1 .pg u{position:absolute;top:-3px;bottom:-3px;width:3px;background:#1d1c1a}
.b1 .st{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:2px;background:rgba(255,255,255,.22);letter-spacing:.02em}
.b1 .st.ok{background:#fff;color:#C23B66}
/* Diagramm-Box */
.pnl{flex:1;min-height:0;background:#F7F5F0;border:1px solid #E4E0D6;border-radius:20px;padding:16px 28px 14px;display:flex;flex-direction:column;box-sizing:border-box}
.kr{display:grid;grid-template-columns:120px minmax(0,1fr);align-items:center;height:34px;flex-shrink:0}
.kr .l{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5f594e;text-align:right;padding-right:14px;white-space:nowrap}
.kr .l small{font-weight:600;color:#8a8478;letter-spacing:0}
.kr .v{display:flex;gap:14px;padding:0 6px;min-width:0}
.kr .v span{flex:1;min-width:0;text-align:center;font-size:18px;font-weight:700;border-radius:6px;padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kr.nmr .v span{font-size:19px;color:#1d1c1a}
.kr .v span.k-okb,.kr .v span.k-midb,.kr .v span.k-nob,.kr .v span.k-none{font-size:17px}
.kr.crr{height:46px}
.kr.crr .v span.k-okb,.kr.crr .v span.k-midb,.kr.crr .v span.k-nob,.kr.crr .v span.k-none{font-size:20px;padding:6px 0;border-radius:8px}
.k-okb{background:#E2603C;color:#fff}.k-midb{background:#FBD5C6;color:#9A3F22}.k-nob{background:#C9C2B4;color:#3a3833}.k-none{background:#EFECE5;color:#B4AC9C}
.ch{flex:1;min-height:0;position:relative;display:grid;grid-template-columns:120px minmax(0,1fr);margin-top:80px}
.ch .yl{position:relative}
.ch .yl span{position:absolute;right:14px;transform:translateY(50%);font-size:17px;font-weight:600;color:#8a8478}
.ch .pl{position:relative}
.gl{position:absolute;left:0;right:0;border-top:1px solid #E4E0D6}
.bars{position:absolute;inset:0;display:flex;gap:14px;align-items:flex-end;padding:0 6px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars .c b{font-size:24px;font-weight:700;margin-bottom:4px}
.bars .st{width:72%;display:flex;flex-direction:column-reverse;border-radius:10px 10px 2px 2px;overflow:hidden;transition:height .8s}
.bars .st i{display:block;flex-shrink:0}
.sollN{position:absolute;left:0;right:0;border-top:4px dashed #D9541E;z-index:2}
.sollN span{position:absolute;left:-112px;top:-14px;background:#D9541E;color:#fff;font-size:14px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.sollF{position:absolute;left:0;right:0;border-top:2px dashed rgba(217,84,30,.4);z-index:1}
.sollF span{position:absolute;right:0;top:-22px;font-size:13px;font-weight:700;color:rgba(217,84,30,.8)}
.ft{display:flex;align-items:center;gap:18px;margin-top:10px;font-size:16px;color:#5f594e;flex-shrink:0}
.ft .stand{color:#8a8478;font-weight:600}.ft .stand.alt{color:#C9502F}
.ft .lg{margin-left:auto;display:flex;gap:18px;align-items:center}
.ft i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.leer{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8a8478;font-size:30px;font-weight:600;gap:10px}
.leer small{font-size:20px;font-weight:500}
.msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:34px;font-weight:700;color:#3a3833;gap:14px;padding:40px}
.msg small{font-size:20px;font-weight:500;color:#8a8478;max-width:900px;line-height:1.5}
/* Feier direkt im Diagramm: Abzeichen über der Säule + Konfetti-Stoß */
.fxb{position:absolute;z-index:40;transform:translate(-50%,-100%);white-space:nowrap;text-align:center;pointer-events:none;
  background:linear-gradient(135deg,#E9773F 0%,#DE5A5E 50%,#C23B66 100%);color:#fff;border-radius:16px;padding:10px 20px;box-shadow:0 14px 34px rgba(194,59,102,.35)}
.fxb b{display:block;font-size:40px;font-weight:300;line-height:1.05}
.fxb small{display:block;font-size:15px;font-weight:700;letter-spacing:.12em;margin-bottom:2px}
.fxb::after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:#DE5A5E}
.fxc{position:absolute;z-index:39;width:12px;height:18px;border-radius:3px;pointer-events:none}
.c.fxon .st{box-shadow:0 0 0 4px #fff,0 0 0 8px #F08566,0 18px 40px rgba(240,133,102,.45)}
.kr .v span.fxcell{outline:3px solid #F08566;outline-offset:2px;border-radius:6px}
@keyframes crFlip{0%{transform:rotateX(0)}45%{transform:rotateX(90deg)}55%{transform:rotateX(-90deg)}100%{transform:rotateX(0)}}
.kr .v span.crflip{animation:crFlip .9s ease-in-out}
.kr .v span.crglow{box-shadow:0 0 0 3px #fff,0 0 18px 4px rgba(240,133,102,.75)}
.tcf{position:absolute;top:-40px;z-index:45;width:16px;height:24px;border-radius:4px;pointer-events:none}
/* Top 3 um 16:00: Karte über der verschwommenen Ansicht */
.tv{transition:filter .6s ease}
.tv.blur{filter:blur(14px) saturate(.9)}
#t3dim{position:absolute;inset:0;z-index:60;background:rgba(29,28,26,.28);opacity:0;transition:opacity .6s}
#t3dim.on{opacity:1}
#t3{position:absolute;z-index:61;left:330px;right:330px;top:150px;bottom:110px;background:#F7F5F0;border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;color:#1d1c1a;
  opacity:0;transform:translateY(30px) scale(.97);transition:opacity .6s,transform .6s cubic-bezier(.2,1.2,.4,1)}
#t3.on{opacity:1;transform:none}
#t3 .hd{text-align:center;margin-top:40px}#t3 .hd small{display:block;font-size:22px;font-weight:700;letter-spacing:.22em;color:#8a8478}#t3 .hd b{display:block;font-size:64px;font-weight:300;margin-top:4px}
#t3 .st3{position:absolute;left:90px;right:90px;bottom:0;display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:22px;align-items:end}
#t3 .pc{display:flex;flex-direction:column;align-items:center;text-align:center}
#t3 .cr{font-size:40px;line-height:1;height:44px;opacity:0;transform:scale(.2)}
#t3 .cr.on{opacity:1;transform:scale(1);transition:all .5s cubic-bezier(.2,1.6,.4,1)}
#t3 .nm{font-size:36px;font-weight:700;min-height:44px;white-space:nowrap}
#t3 .nm i{font-style:normal;display:inline-block;width:3px;height:34px;background:#F08566;margin-left:3px;vertical-align:-4px;animation:t3cur .7s steps(1) infinite}
@keyframes t3cur{50%{opacity:0}}
#t3 .sb{font-size:20px;color:#6b665c;opacity:0;transition:opacity .5s;min-height:26px}#t3 .sb.on{opacity:1}
#t3 .blk{width:100%;margin-top:10px;border-radius:18px 18px 0 0;display:flex;flex-direction:column;align-items:center;height:0;overflow:hidden;transition:height .8s cubic-bezier(.2,1.1,.4,1)}
#t3 .blk .pl{font-size:100px;font-weight:200;line-height:1;margin-top:12px}#t3 .blk .op{font-size:24px;font-weight:600}
#t3 .p1{background:linear-gradient(160deg,#E9773F 0%,#DE5A5E 55%,#C23B66 100%);color:#fff}#t3 .p2{background:#E6E1D7;color:#3a3833}#t3 .p3{background:#EFECE5;color:#3a3833}
/* Tagesbester bei Marge, CR OEM und CR MY: Zelle im Banner-Verlauf mit Krone */
.kr .v span.best{position:relative;background:linear-gradient(135deg,#E9773F 0%,#DE5A5E 50%,#C23B66 100%)!important;color:#fff!important;border-radius:8px;box-shadow:0 6px 16px rgba(194,59,102,.35);overflow:visible}
.kr .v span.best::after{content:'👑';position:absolute;right:-12px;top:-21px;font-size:28px;line-height:1;transform:rotate(22deg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));pointer-events:none}
/* Margen-Champion: Figur läuft herein, schiebt das Podest weg und jubelt */
#t3 .st3{transition:none}
#t3 .man{position:absolute;bottom:0;width:150px;height:300px;z-index:5}
#t3 .man svg{width:100%;height:100%;overflow:visible}
#t3 .man .lg1,#t3 .man .lg2,#t3 .man .ar1,#t3 .man .ar2{transition:transform .35s ease}
#t3 .man.walk .lg1{animation:mLeg .5s ease-in-out infinite alternate}
#t3 .man.walk .lg2{animation:mLeg .5s ease-in-out infinite alternate-reverse}
#t3 .man.walk .ar1{animation:mArm .5s ease-in-out infinite alternate-reverse}
#t3 .man.walk .ar2{animation:mArm .5s ease-in-out infinite alternate}
@keyframes mLeg{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes mArm{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
#t3 .man.push .ar1,#t3 .man.push .ar2{animation:none;transform:rotate(82deg)}
#t3 .man.cheer .ar1{animation:none;transform:rotate(158deg)}
#t3 .man.cheer .ar2{animation:none;transform:rotate(-158deg)}
#t3 .man.cheer .lg1{animation:none;transform:rotate(-8deg)}#t3 .man.cheer .lg2{animation:none;transform:rotate(8deg)}
#t3 .man.cheer svg{animation:mJump .7s ease-in-out infinite}
#t3 .man.flip svg{transform:scaleX(-1)}
#t3 .man.flip.cheer svg{animation:none}
#t3 .man.idle .ar1{transform:rotate(14deg)}#t3 .man.idle .ar2{transform:rotate(-14deg)}
#t3 .man.lunge svg{animation:mLunge .5s ease-out}
@keyframes mLunge{0%{transform:translateX(0)}40%{transform:translateX(-26px) rotate(-8deg)}100%{transform:translateX(0)}}
#t3 .man.flip.lunge svg{animation:mLungeR .5s ease-out}
@keyframes mLungeR{0%{transform:scaleX(-1)}40%{transform:scaleX(-1) translateX(-26px) rotate(-8deg)}100%{transform:scaleX(-1)}}
#t3.pod .blk .pl{font-size:70px}
#t3 .scene{position:absolute;inset:0;transform-origin:0 100%}
#t3 .rl{position:absolute;right:56px;top:175px;width:560px;z-index:7}
#t3 .rl h4{margin:0 0 10px;font-size:18px;font-weight:700;letter-spacing:.14em;color:#8a8478;text-transform:uppercase}
#t3 .rl .r{display:grid;grid-template-columns:54px 1fr auto;align-items:center;height:50px;border-bottom:1px solid #E4E0D6;font-size:24px;opacity:0;transform:translateX(40px)}
#t3 .rl .r b{font-size:28px;font-weight:200;color:#8a8478}#t3 .rl .r span{font-weight:700}#t3 .rl .r em{font-style:normal;font-weight:700;color:#C23B66}
/* Siegerehrung: dunkle Nacht, Figur zündet Rakete, Feuerwerk */
#t3dim.dark{background:rgba(12,11,10,.72)}
#t3.night{background:radial-gradient(ellipse at 50% 110%,#3a2a24 0%,#1d1c1a 45%,#0e0d0c 100%);color:#fff;box-shadow:0 30px 90px rgba(0,0,0,.6)}
#t3.night .gr{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(#2a2622,#151412);border-top:1px solid #3a3530}
#t3.night .kk{position:absolute;left:0;right:0;top:44px;text-align:center;font-size:22px;font-weight:700;letter-spacing:.22em;color:#A39D91;opacity:0;transition:opacity .8s}
#t3.night .val{position:absolute;left:0;right:0;top:170px;text-align:center;font-size:150px;font-weight:200;line-height:1;opacity:0;transform:scale(.7);transition:opacity .6s,transform .8s cubic-bezier(.2,1.5,.4,1);
  background:linear-gradient(90deg,#F2884F,#F0607A);-webkit-background-clip:text;background-clip:text;color:transparent}
#t3.night .val small{font-size:56px;font-weight:300}
#t3.night .who{position:absolute;left:0;right:0;top:350px;text-align:center;opacity:0;transform:translateY(30px) scale(.8);transition:opacity .7s,transform .9s cubic-bezier(.2,1.5,.4,1)}
#t3.night .who .tr{font-size:56px;line-height:1}#t3.night .who small{display:block;font-size:26px;font-weight:300;color:#C9C2B4;margin-top:8px}
#t3.night .who b{display:block;font-size:92px;font-weight:700;color:#fff;text-shadow:0 0 30px rgba(240,133,102,.55)}
#t3.night .rest{position:absolute;left:0;right:0;top:600px;text-align:center;font-size:24px;color:#A39D91;opacity:0;transition:opacity .8s}
#t3.night .on{opacity:1!important;transform:none!important}
#t3 .rk{position:absolute;bottom:40px;width:40px;height:120px;z-index:4}
#t3 .rk svg{width:100%;height:100%;overflow:visible}
#t3 .fz{position:absolute;width:10px;height:10px;border-radius:50%;background:#FFD27A;box-shadow:0 0 12px 6px rgba(255,170,60,.8);z-index:6;animation:fzF .15s infinite alternate}
@keyframes fzF{from{transform:scale(.7)}to{transform:scale(1.3)}}
#t3 .fwp{position:absolute;width:7px;height:7px;border-radius:50%;z-index:3;pointer-events:none}
#t3 .fwf{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;z-index:3;pointer-events:none;box-shadow:0 0 60px 30px rgba(255,240,220,.8)}
#t3 .blk .bn{font-size:26px;font-weight:700;margin-top:6px;white-space:nowrap}#t3 .blk .bv{font-size:22px;font-weight:600;opacity:.9}
@keyframes mJump{0%,100%{transform:translateY(0)}45%{transform:translateY(-34px)}}
#t3 .chmp{position:absolute;left:0;right:0;text-align:center;z-index:6;opacity:0;transform:scale(.6);transition:opacity .6s,transform .7s cubic-bezier(.2,1.5,.4,1)}
#t3 .chmp.on{opacity:1;transform:none}
#t3 .chmp small{display:block;font-size:22px;font-weight:700;letter-spacing:.22em;color:#8a8478}
#t3 .chmp .nm2{font-size:64px;font-weight:700;margin-top:6px}
#t3 .chmp .eu{font-size:130px;font-weight:200;line-height:1;background:linear-gradient(90deg,#E9773F,#C23B66);-webkit-background-clip:text;background-clip:text;color:transparent}
#t3 .chmp .sb2{font-size:22px;color:#6b665c;margin-top:6px}
/* Ankündigung der Power Hour: Countdown 10 → 1, dann „Let's go!“ */
#t3.intro{background:linear-gradient(150deg,#E9773F 0%,#DE5A5E 50%,#C23B66 100%);color:#fff;text-align:center}
#t3.intro .ik{margin-top:60px;font-size:24px;font-weight:700;letter-spacing:.24em;opacity:.9}
#t3.intro .it{font-size:96px;font-weight:700;line-height:1.05;margin-top:10px}
#t3.intro .ig{font-size:34px;font-weight:300;margin-top:14px}#t3.intro .ig b{font-weight:700}
#t3.intro .iz{font-size:24px;opacity:.85;margin-top:6px}
#t3.intro .cd{position:absolute;left:0;right:0;bottom:70px;font-size:260px;font-weight:200;line-height:1}
#t3.intro .go{position:absolute;left:0;right:0;bottom:120px;font-size:150px;font-weight:800;letter-spacing:.02em;opacity:0;transform:scale(.4)}
#t3.intro .go.on{opacity:1;transform:scale(1);transition:all .5s cubic-bezier(.2,1.6,.4,1)}
/* Endspurt */
#t3.endsp .ecd{position:absolute;left:0;right:0;top:150px;text-align:center;font-size:110px;font-weight:200;line-height:1;color:#C23B66;z-index:8}
#t3.endsp .ecd.big{font-size:230px;top:130px}
#t3.endsp .eend{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(247,245,240,.94);z-index:9;opacity:0;pointer-events:none;transition:opacity .5s}
#t3.endsp .eend.on{opacity:1}#t3.endsp .eend b{font-size:150px;font-weight:800;background:linear-gradient(90deg,#E9773F,#C23B66);-webkit-background-clip:text;background-clip:text;color:transparent}
#t3.endsp .eend small{font-size:30px;color:#6b665c;margin-top:10px}
#t3 .man.watch .ar1{transform:rotate(78deg)}#t3 .man.watch .ar2{transform:rotate(-12deg)}
#t3 .man.watch svg{animation:mTap 1.4s ease-in-out infinite}
@keyframes mTap{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
#t3 .man.pump .ar2{animation:mPump .45s ease-in-out infinite alternate}#t3 .man.pump .ar1{transform:rotate(12deg)}
@keyframes mPump{from{transform:rotate(-120deg)}to{transform:rotate(-175deg)}}
#t3 .man.pump svg{animation:mBob .45s ease-in-out infinite alternate}
@keyframes mBob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
/* Wochenziel-Karten (Do 12:20, Fr 09:00) */
#wk{position:absolute;z-index:61;background:#F7F5F0;border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;color:#1d1c1a;padding:40px 56px;box-sizing:border-box;
  opacity:0;transform:translateY(30px) scale(.97);transition:opacity .6s,transform .6s cubic-bezier(.2,1.2,.4,1)}
#wk.on{opacity:1;transform:none}
#wk .k{font-size:22px;font-weight:700;letter-spacing:.22em;color:#8a8478;text-align:center}
#wk .t{font-size:58px;font-weight:300;text-align:center;margin-top:4px;line-height:1.1}
#wk .t b{font-weight:600;background:linear-gradient(90deg,#E9773F,#C23B66);-webkit-background-clip:text;background-clip:text;color:transparent}
#wk .s{font-size:21px;color:#6b665c;text-align:center;margin-top:8px}
#wk table{width:100%;border-collapse:collapse;margin-top:24px;font-size:24px}
#wk th{background:#EFECE5;color:#5f594e;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:12px 14px;text-align:right}
#wk th:first-child,#wk td:first-child{text-align:left}
#wk td{padding:0 14px;border-bottom:1px solid #E4E0D6;text-align:right;font-weight:600;white-space:nowrap}
#wk td.nm{font-weight:700}#wk .fe{font-size:30px;font-weight:700;color:#C23B66}
#wk .pb{position:relative;height:16px;border-radius:8px;background:#EFECE5;overflow:hidden;min-width:220px}
#wk .pb i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;width:0;transition:width 1.2s cubic-bezier(.2,1,.4,1)}
#wk .chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px;font-size:18px;color:#6b665c;align-items:center}
#wk .chips span{background:#EFECE5;border-radius:999px;padding:4px 14px;font-weight:700;color:#3a3833}
#wk .hb{display:grid;grid-template-columns:290px minmax(0,1fr) 230px;align-items:center;gap:18px;height:60px}
#wk .hb .n{font-size:23px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wk .hb .tr{position:relative;height:26px;background:#EFECE5;border-radius:8px}
#wk .hb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;width:0;transition:width 1.2s cubic-bezier(.2,1,.4,1)}

  function phState(t,now){if(STATIC)return null;var n=now.getTime(),res=null;

    (D.powerhours||[]).forEach(function(h){if(res||h.datum!==t)return;var S=phTs(t,h.start),E=phTs(t,h.ende);if(n<E||n>E+12*60000||lsGet('phdone_'+h.id))return;

  function phList(P){var KV=phKV(P.h.kpi),agg={};(D.ticks||[]).forEach(function(k){var ts=new Date(k.ts).getTime();if(ts<=P.S||ts>P.cut)return;var a=agg[k.e]||(agg[k.e]={opt:0,my:0,marge:0,mm:0});
      a.opt+=(k.oem||0)+(k.ups||0)+(k.wka||0);a.my+=k.my||0;a.marge+=+k.m||0;if((k.my||0)>0&&(k.oem||0)>0)a.mm+=(+k.om||0)*Math.min(1,k.my/k.oem);});
    return LASTROWS.map(function(r){var a=agg[r.e.id]||{opt:0,my:0,marge:0,mm:0};return {e:r.e,opt:a.opt,my:a.my,marge:a.marge,mm:a.mm};}).filter(function(x){return KV(x)>0;}).sort(function(x,y){return KV(y)-KV(x)||y.opt-x.opt;});}

    // (vergangene Tage nur, wenn es Zahlen gibt – Urlaub/Krank ohne Zahlen senkt das Ziel; heute/kommende Tage ohne eingetragene Abwesenheit)
    (function(){var dw=(new Date(t+'T12:00:00').getDay()+6)%7,mo=addDays(t,-dw),L=[];
      function absOn(id,d){var r=null;(D.abwesend||[]).forEach(function(a){if(a.employee_id===id&&a.von<=d&&a.bis>=d)r=r||{};if(r&&a.employee_id===id&&a.von<=d&&a.bis>=d){if(a.halb)r.halb=true;else r.ganz=true;}});return r;}
      emps.forEach(function(e){var b=0,z=0;for(var k=0;k<5;k++){var d=addDays(mo,k),pp=(perf[e.id]||{})[d],ph=plannedHours(e,d);
          if(d<=t)b+=opt(pp);
          if(d<t){if(opt(pp)>0)z+=ph;}else{var a=absOn(e.id,d);if(a&&a.ganz&&!opt(pp))continue;z+=a&&a.halb?ph*0.5:ph;}}
        var zr=Math.round(z*OPH);if(zr<=0)return;
        var a0=absOn(e.id,t),pl=plannedHours(e,t);if(a0&&a0.halb)pl*=0.5;var rest=(a0&&a0.ganz)?0:Math.max(0,pl-Math.min(elapsedAt(e,t,refMin),pl));
        L.push({name:e.name,b:b,z:zr,f:zr-b,rest:rest,away:!!(a0&&a0.ganz),fri:plannedHours(e,addDays(mo,4))});});
      LASTWEEK=L;})();
    if(fresh){if(!STATIC&&feier('zaehlen',true))countUp(BV);else LASTBV=BV;if(!STATIC&&feier('kippen',true))crFlip();else LASTCR=null;
      if(LASTBEST){[['o',1],['m',2],['g',4]].forEach(function(x){var id=BEST[x[0]];if(id&&id!==LASTBEST[x[0]]){var el=stage.querySelector('.kr .v span[data-ro="'+x[1]+'"][data-eid="'+id+'"]');
        if(el&&el.animate)el.animate([{transform:'scale(.6) rotate(-6deg)',opacity:.3},{transform:'scale(1.25) rotate(3deg)',opacity:1,offset:.5},{transform:'scale(1)'}],{duration:1100,easing:'cubic-bezier(.2,1.4,.4,1)'});}});}
      LASTBEST={o:BEST.o,m:BEST.m,g:BEST.g};}
    if(fresh){
      var wait=(!STATIC&&feier('aufstieg',true))?animCols(old,ups):0;
      var ev=teamEvents(S,t).concat(events(rows,t));PREVT={opt:S.opt};PREVT_DAY=t;
      if(ev.length){setTimeout(function(){ev.slice(0,6).forEach(function(c){CEL_Q.push(c);});celNext();},wait+300);}
      rankSave(rows,t);prevSave(rows,t);
      // Probe für die Feier-Bildschirme: ?test=ziel | marge | auftrag
      if(TEST==='woche'){TEST='';WEEK_TEST_UNTIL=Date.now()+90000;setTimeout(function(){viewSwitch('woche');setTimeout(function(){viewSwitch('monat');setTimeout(function(){viewSwitch('tag');},25000);},25000);},1000);}
      if(TEST==='dori12'){TEST='';setTimeout(doriShake,1500);}
      if(TEST==='endspurt'){TEST='';setTimeout(function(){var n=Date.now();endShow({h:{id:0,kpi:'opt',start:'',ende:''},S:n-55*60000,E:n+25000});},1000);}
      if(TEST==='intro'){TEST='';setTimeout(function(){var d=new Date(Date.now()+60000);phIntro({kpi:'opt',start:pad(d.getHours())+':'+pad(d.getMinutes()),ende:pad((d.getHours()+1)%24)+':'+pad(d.getMinutes())},Date.now()+14000);},1000);}
      if(TEST==='sieger'){TEST='';setTimeout(function(){var tt=LASTROWS.filter(function(r){return r.opt>0;}).slice(0,3);if(!tt.length)return;ceremonyShow({id:tt[0].e.id,kick:'⚡ POWER HOUR · OPTIMIERUNGEN',unit:'Optimierungen',value:tt[0].opt,fmt:function(v){return Math.round(v);},name:tt[0].e.name,rest:(tt[1]?'Platz 2 '+tt[1].e.name+' · '+tt[1].opt:'')+(tt[2]?'   ·   Platz 3 '+tt[2].e.name+' · '+tt[2].opt:''),ms:120000});},1200);}
      if(TEST==='halbzeit'){TEST='';setTimeout(function(){var al=LASTROWS.filter(function(r){return r.opt>0;}).map(function(r){return {id:r.e.id,name:r.e.name,val:r.opt+' Opt.'};});podiumShow(al.slice(0,3),'⚡ POWER HOUR · HALBZEIT','Zwischenstand','Opt.',120000,al);},1200);}
      if(TEST==='top3'){TEST='';setTimeout(function(){top3Show(15000);},1200);}
      if(TEST==='donnerstag'||TEST==='freitag'){var tk=TEST==='donnerstag'?'do':'fr';TEST='';setTimeout(function(){if(!wkShow(tk))console.log('Wochenkarte: niemand passt');},1200);}
      if(TEST==='team'){TEST='';var tb=Math.max(100,Math.floor(S.opt/100)*100);setTimeout(function(){CEL_Q.push({team:1,kick:'TEAM-MEILENSTEIN',big:num(tb)+' Optimierungen'});celNext();},1500);}
      if((TEST==='ziel'||TEST==='marge'||TEST==='auftrag')&&rows.length){var tr=rows[0],o=PREV[tr.e.id];
        if(TEST==='ziel'){o.opt=Math.max(0,Math.round(tr.ziel)-1);if(tr.opt<Math.round(tr.ziel))tr.ziel=tr.opt;}
        if(TEST==='marge'){o.marge=1990;if(tr.marge<2000)tr.marge=2150;}
        if(TEST==='auftrag'){o.marge=tr.marge-620;}
        var tt=TEST;TEST='';setTimeout(function(){var ev2=events(rows,t);if(!ev2.length&&tt==='ziel')ev2=[{id:tr.e.id,cell:'name',kick:'TAGESZIEL ERREICHT',big:tr.opt+' ✓'}];ev2.forEach(function(c){CEL_Q.push(c);});celNext();prevSave(rows,t);},1500);}
      if(TEST==='aufstieg'&&!TESTFAKE&&rows.length>3){TESTFAKE=true;var tr=rows[1];RANK[tr.e.id]={rank:4,opt:tr.opt-3};
        // Probe: so tun, als stünde die Person vorher auf Platz 4
        var fk=rows.slice();fk.splice(1,1);fk.splice(3,0,tr);D._fakeOrder=fk.map(function(r){return r.e.id;});render(false,false);
        setTimeout(function(){D._fakeOrder=null;TEST='';render(false,true);},2500);}
    }
  }

  // Vorführ-Modus (?demo=1): alle 2 Minuten eine andere Animation bzw. Karte, sonst normaler Betrieb
  if(Q.get('demo')==='1'){
    var DSTEPS=['dori12','aufstieg','ziel','marge','auftrag','zahlen','team','top3','intro','halbzeit','sieger','donnerstag','freitag'],di=0;
    function demoNext(){if(!D)return;if(CEL_ON){setTimeout(demoNext,5000);return;}var st=DSTEPS[di%DSTEPS.length];di++;
      if(st==='zahlen'){if(LASTBV)LASTBV=LASTBV.map(function(x){return [x[0]==null?null:x[0]*0.85,x[1]];});if(LASTCR){var n=0;Object.keys(LASTCR).forEach(function(k){if(n<6){LASTCR[k]='x';n++;}});}render(false,true);return;}
      if(st==='aufstieg')TESTFAKE=false;
      TEST=st;render(false,true);}
    setTimeout(function(){demoNext();setInterval(demoNext,120000);},20000);
  }
  load();
  setInterval(load,60000);
  setInterval(function(){if(D)render(false);},30000); // Soll-Linie läuft mit der Uhr
  // alle 6 Stunden neu laden, damit Änderungen an der Seite auch auf dem Fernseher ankommen
  setTimeout(function(){location.reload();},6*3600000);
  // Bildschirm wach halten (wo der Browser es kann)
  function wake(){try{if(!EMBED&&navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){});}catch(e){}}
  wake();document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')wake();});
})();
</script>
